<svg xmlns="http://www.w3.org/2000/svg" width="910" height="232" viewBox="0 0 910 232" role="img" aria-label="How wavexplain works, in four steps" font-family="-apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Card 1 -->
  <rect x="10" y="8" width="215" height="214" rx="12" fill="#ffffff" stroke="#e0ded4"/>
  <circle cx="32" cy="34" r="11" fill="#EF9F27"/><text x="32" y="38" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="50" y="39" font-size="14" font-weight="700" fill="#2c2c2a">Start with the history</text>
  <polyline points="26,98 50,90 74,94 98,82 122,86 146,72 170,78 205,66" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="26" y="138" font-size="12.5" fill="#5f5e5a">Take a product's recent</text>
  <text x="26" y="156" font-size="12.5" fill="#5f5e5a">daily sales.</text>

  <!-- Card 2 -->
  <rect x="235" y="8" width="215" height="214" rx="12" fill="#ffffff" stroke="#e0ded4"/>
  <circle cx="257" cy="34" r="11" fill="#EF9F27"/><text x="257" y="38" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="275" y="39" font-size="14" font-weight="700" fill="#2c2c2a">Forecast what's next</text>
  <polyline points="251,94 285,86 315,88 345,80" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round"/>
  <polyline points="345,80 375,76 405,78 430,68" fill="none" stroke="#EF9F27" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
  <text x="251" y="138" font-size="12.5" fill="#5f5e5a">The model predicts the</text>
  <text x="251" y="156" font-size="12.5" fill="#5f5e5a">coming days.</text>

  <!-- Card 3 -->
  <rect x="460" y="8" width="215" height="214" rx="12" fill="#ffffff" stroke="#e0ded4"/>
  <circle cx="482" cy="34" r="11" fill="#EF9F27"/><text x="482" y="38" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="500" y="39" font-size="14" font-weight="700" fill="#2c2c2a">Ask &#8220;what if?&#8221;</text>
  <text x="486" y="98" font-size="24" fill="#1FA8A0">?</text>
  <rect x="512" y="84" width="12" height="16" rx="2" fill="#e0ded4"/>
  <rect x="530" y="74" width="12" height="26" rx="2" fill="#EF9F27"/>
  <rect x="548" y="88" width="12" height="12" rx="2" fill="#e0ded4"/>
  <text x="600" y="98" font-size="24" fill="#1FA8A0">?</text>
  <text x="476" y="138" font-size="12.5" fill="#5f5e5a">Hide the promotion days</text>
  <text x="476" y="156" font-size="12.5" fill="#5f5e5a">and forecast again. The</text>
  <text x="476" y="174" font-size="12.5" fill="#5f5e5a">change shows what that</text>
  <text x="476" y="192" font-size="12.5" fill="#5f5e5a">part was worth.</text>

  <!-- Card 4 -->
  <rect x="685" y="8" width="215" height="214" rx="12" fill="#ffffff" stroke="#e0ded4"/>
  <circle cx="707" cy="34" r="11" fill="#EF9F27"/><text x="707" y="38" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="725" y="39" font-size="14" font-weight="700" fill="#2c2c2a">Get a plain answer</text>
  <rect x="711" y="74" width="34" height="6" rx="3" fill="#888780"/>
  <rect x="711" y="86" width="90" height="6" rx="3" fill="#EF9F27"/>
  <rect x="711" y="98" width="60" height="6" rx="3" fill="#888780"/>
  <text x="701" y="138" font-size="12.5" fill="#5f5e5a">Typical + promotion +</text>
  <text x="701" y="156" font-size="12.5" fill="#5f5e5a">trend, adding up exactly</text>
  <text x="701" y="174" font-size="12.5" fill="#5f5e5a">to the forecast.</text>
</svg>
